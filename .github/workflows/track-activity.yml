name: Track Coding Activity

on:
  workflow_dispatch:
    inputs:
      activity:
        description: 'Activity type'
        required: true
        default: 'coding'
        type: choice
        options:
          - coding
          - security-research
          - automation
          - system-building
          - debugging
          - learning
          - ctf
          - review
      duration:
        description: 'Duration in minutes'
        required: false
        default: '60'
  schedule:
    - cron: '30 0 * * *'

jobs:
  track:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Update Activity Data
        run: python3 .github/scripts/update_activity.py
        env:
          ACTIVITY_TYPE: ${{ github.event.inputs.activity || '' }}
          DURATION_MINUTES: ${{ github.event.inputs.duration || '0' }}
          EVENT_NAME: ${{ github.event_name }}
          TZ: Asia/Dhaka

      - name: Update Streak Stats SVG
        run: |
          curl -sL --max-time 30 "https://streak-stats.demolab.com?user=emonhmamun&theme=dark&hide_border=true&background=0d1117&stroke=A855F7&ring=22D3EE&fire=EC4899&currStreakLabel=22D3EE&sideLabels=c9d1d9" -o assets/streak-stats.svg
          if [ -f assets/streak-stats.svg ] && [ $(wc -c < assets/streak-stats.svg) -gt 1000 ]; then
            echo "Streak SVG updated successfully"
          else
            echo "Streak SVG download failed, keeping existing"
            git checkout -- assets/streak-stats.svg 2>/dev/null || true
          fi

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "🔄 activity: update coding status" && git push)
